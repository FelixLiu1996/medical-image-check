[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-image-check"
version = "0.1.0a1"
description = "Local duplicate detection for medical research images and spreadsheet data"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [
  { name = "Medical Image Check contributors" },
]
dependencies = [
  "openpyxl==3.1.5",
  "PySide6_Essentials==6.11.2",
  "xlrd==2.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
  "ruff==0.16.4",
  "xlwt==1.3.0",
]

[project.scripts]
medical-image-check = "medical_image_check.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
