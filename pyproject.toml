[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-image-check"
version = "0.1.0a13"
description = "Local duplicate detection for medical research images and spreadsheet data"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [
  { name = "Medical Image Check contributors" },
]
dependencies = [
  "numpy==2.5.2",
  "opencv-python-headless==4.14.0.94",
  "openpyxl==3.1.5",
  "PySide6_Essentials==6.11.2",
  "reportlab==4.4.9",
  "xlrd==2.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
  "ruff==0.16.4",
  "xlwt==1.3.0",
]
package = [
  "Nuitka==4.1.1",
]

[project.scripts]
medical-image-check = "medical_image_check.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyside6-project]
files = [
  "main.py",
  "src/medical_image_check/__init__.py",
  "src/medical_image_check/__main__.py",
  "src/medical_image_check/app.py",
  "src/medical_image_check/domain/__init__.py",
  "src/medical_image_check/domain/excel_settings.py",
  "src/medical_image_check/domain/image_settings.py",
  "src/medical_image_check/domain/models.py",
  "src/medical_image_check/domain/performance.py",
  "src/medical_image_check/domain/project.py",
  "src/medical_image_check/domain/review.py",
  "src/medical_image_check/engines/__init__.py",
  "src/medical_image_check/engines/excel_advanced.py",
  "src/medical_image_check/engines/excel_exact.py",
  "src/medical_image_check/engines/excel_patterns.py",
  "src/medical_image_check/engines/dot_blot.py",
  "src/medical_image_check/engines/fluorescence.py",
  "src/medical_image_check/engines/image_exact.py",
  "src/medical_image_check/engines/image_similarity.py",
  "src/medical_image_check/engines/pathology.py",
  "src/medical_image_check/engines/western_blot.py",
  "src/medical_image_check/infrastructure/__init__.py",
  "src/medical_image_check/infrastructure/images.py",
  "src/medical_image_check/infrastructure/performance.py",
  "src/medical_image_check/infrastructure/project_store.py",
  "src/medical_image_check/infrastructure/spreadsheets.py",
  "src/medical_image_check/services/__init__.py",
  "src/medical_image_check/services/basic_scan.py",
  "src/medical_image_check/services/excel_report.py",
  "src/medical_image_check/services/feedback_export.py",
  "src/medical_image_check/services/html_report.py",
  "src/medical_image_check/services/pdf_report.py",
  "src/medical_image_check/services/performance_export.py",
  "src/medical_image_check/services/report_common.py",
  "src/medical_image_check/ui/__init__.py",
  "src/medical_image_check/ui/main_window.py",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
